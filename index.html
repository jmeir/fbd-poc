<!DOCTYPE html>
<html>
<head>
  <title>FBD PoC Entra External ID Demo</title>
  <script src="https://unpkg.com/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <h2>Entra External ID – FBD PoC testing</h2>

  <button onclick="signIn()">Sign In</button>
  <button onclick="signOut()">Sign Out</button>

  <pre id="output"></pre>

  <script>
  // Wait until MSAL is actually available
  if (!window.msal) {
    console.error("MSAL failed to load");
  }

  const msalConfig = {
    auth: {
      clientId: "d3e95502-ebff-4986-a1b6-4866a35c3136",
      authority: "https://extidtest1jmeegan.ciamlogin.com/0cc4e50b-cb60-4d44-8ab4-c124e5d976c4",
      redirectUri: window.location.href
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  function signIn() {
    msalInstance.loginPopup({
      scopes: ["openid", "profile"]
    }).then(response => {
      document.getElementById("output").textContent =
        JSON.stringify(response.account, null, 2);
    }).catch(error => console.error(error));
  }

  function signOut() {
    msalInstance.logoutPopup();
    document.getElementById("output").textContent = "";
  }
</script>
</body>
</html>
